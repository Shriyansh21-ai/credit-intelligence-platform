name: Bug report
description: Report a defect in the platform
labels: [bug, triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and the impact.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call endpoint ...
        2. With payload ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [S1 - outage, S2 - major, S3 - minor, S4 - cosmetic]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.4.0 or commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs / correlation ID
      render: shell
