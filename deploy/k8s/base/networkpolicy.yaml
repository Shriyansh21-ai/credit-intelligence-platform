# Network policies (Phase 11, M4) — default-deny ingress, explicit allowlists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ai-credit
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# Nginx edge accepts ingress from the ingress controller namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-nginx
  namespace: ai-credit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8081}
---
# Backend accepts traffic only from nginx and worker/scheduler peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-backend
  namespace: ai-credit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports:
        - {protocol: TCP, port: 8000}
    # Allow Prometheus scraping from the monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 8000}
---
# Frontend accepts traffic only from nginx.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-frontend
  namespace: ai-credit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports:
        - {protocol: TCP, port: 3000}
---
# Postgres/Redis accept traffic only from app-tier pods in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-datastores
  namespace: ai-credit
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: ["postgres", "redis"]}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: ["backend", "worker", "scheduler", "db-migrate", "db-backup"]}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
