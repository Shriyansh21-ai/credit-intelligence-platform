# Background job worker — Deployment (Phase 11, M4). HTTP-less; exec probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-credit
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: ai-credit-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: ai-credit-platform
    spec:
      serviceAccountName: ai-credit
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ai-credit/worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.app.workers.worker"]
          envFrom:
            - configMapRef: {name: ai-credit-config}
            - secretRef: {name: ai-credit-secrets}
          env:
            - {name: RUN_MIGRATIONS, value: "0"}
            - {name: WORKER_HEARTBEAT_FILE, value: "/tmp/worker-heartbeat"}
          livenessProbe:
            exec:
              command: ["python", "-m", "backend.app.workers.healthcheck", "--max-age", "60"]
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "2", memory: "2Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
