# Frontend SSR — Deployment + Service (Phase 11, M4).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-credit
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: ai-credit-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: ai-credit-platform
    spec:
      serviceAccountName: ai-credit
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ai-credit/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: PORT, value: "3000"}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1", memory: "512Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ai-credit
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: ai-credit-platform
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - {name: http, port: 3000, targetPort: http}
  type: ClusterIP
