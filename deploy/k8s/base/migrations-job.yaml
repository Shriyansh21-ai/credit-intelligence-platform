# Database migration Job (Phase 11, M4).
# Runs Alembic to head once per release, before app replicas roll out. Use a
# Helm/Argo pre-install/pre-upgrade hook (or `kubectl apply` gated in CI) to
# sequence it ahead of the Deployments.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: ai-credit
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: ai-credit-platform
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: ai-credit-platform
    spec:
      restartPolicy: Never
      serviceAccountName: ai-credit
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ai-credit/backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: ai-credit-config}
            - secretRef: {name: ai-credit-secrets}
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
