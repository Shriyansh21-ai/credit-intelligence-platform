# PostgreSQL — StatefulSet + headless Service + PVC template (Phase 11, M4).
# For production, prefer a managed database; this self-hosted StatefulSet is
# provided for on-prem / air-gapped installs.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-credit
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ai-credit-platform
spec:
  clusterIP: None          # headless — stable network identity for the StatefulSet
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-credit
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ai-credit-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: ai-credit-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: credit}
            - {name: POSTGRES_USER, value: credit}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: ai-credit-secrets, key: POSTGRES_PASSWORD, optional: true}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "credit"]}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "credit"]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "2", memory: "4Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
