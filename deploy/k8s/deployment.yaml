# Kubernetes Deployment (Phase 8, Milestone 11).
# Stateless API with liveness/readiness/startup probes, resource requests, and a
# rolling-update strategy. Scale with `kubectl scale` or the HPA below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-credit-platform
  labels:
    app: ai-credit-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-credit-platform
  template:
    metadata:
      labels:
        app: ai-credit-platform
    spec:
      containers:
        - name: api
          image: ai-credit-platform:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-credit-config
            - secretRef:
                name: ai-credit-secrets
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-credit-platform
spec:
  selector:
    app: ai-credit-platform
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-credit-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-credit-platform
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
