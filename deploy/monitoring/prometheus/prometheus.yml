# Prometheus scrape configuration (Phase 11, M3 — enriched in M7).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: ai-credit
    env: ${PROM_ENV:-development}

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application metrics (Phase 11, M6 exposes /metrics on the API).
  - job_name: ai-credit-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
