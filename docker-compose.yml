# Docker Compose for local / staging (Phase 8, Milestone 11).
# The app is stateless and scalable; Postgres, Redis and MinIO are provided so
# the storage/cache/broker abstractions can be pointed at real backends. By
# default the app still runs on SQLite + in-process backends (zero-config) —
# uncomment the env vars to switch.
version: "3.9"

services:
  api:
    build: .
    image: ai-credit-platform:latest
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      RUN_MIGRATIONS: "1"
      # DATABASE_URL: postgresql+psycopg://credit:credit@db:5432/credit
      # CACHE_BACKEND: redis
      # REDIS_URL: redis://cache:6379/0
      # STORAGE_BACKEND: minio
      # SECRET_KEY: change-me-in-production
    depends_on:
      - db
      - cache
    deploy:
      replicas: 2            # horizontal scaling — app is stateless
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
      POSTGRES_DB: credit
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
